<template>
    <lightning-quick-action-panel header="AI 메일 초안 만들기">
        <div class="draft">
            <p class="draft__intro">
                보낼 메일 종류를 고르면 AI가 이 프로젝트의 데이터 요청 항목을 읽고 초안을 씁니다.
                초안은 저장만 되며, 실제 발송은 검토 후 직접 해 주세요.
            </p>

            <template lwc:if={context}>
                <div class="draft__project">
                    <span class="draft__project-label">
                        <template lwc:if={context.openedFromTask}>할 일에 연결된 프로젝트 · </template>
                        <strong>{context.projectLabel}</strong>
                    </span>
                    <lightning-button
                        variant="base"
                        label="📂 프로젝트 열기"
                        title="프로젝트 화면으로 이동"
                        onclick={handleOpenProject}
                    ></lightning-button>
                </div>
                <div class={recommendClass}>
                    <p class="draft__counts">
                        마감 지난 자료 <strong>{context.overdueCount}</strong>건 ·
                        보완 필요 <strong>{context.revisionCount}</strong>건 ·
                        마감 임박(3일 이내) <strong>{context.dueSoonCount}</strong>건
                    </p>
                    <template lwc:if={hasMissingInfo}>
                        <p class="draft__counts">비어 있는 정보: <strong>{missingInfoText}</strong></p>
                    </template>
                    <p class="draft__recommend-text">💡 {recommendText}</p>
                </div>
            </template>

            <div class="draft__types">
                <button class={reminderClass} onclick={handleReminder} disabled={isLoading}>
                    <span class="draft__type-icon">🔴</span>
                    <span class="draft__type-title">독촉 메일<template lwc:if={isReminderRecommended}> <span class="draft__star">⭐ 추천</span></template></span>
                    <span class="draft__type-desc">기한 지난·보완 필요 자료 (임박 자료도 함께 안내)</span>
                </button>
                <button class={dueSoonClass} onclick={handleDueSoon} disabled={isLoading}>
                    <span class="draft__type-icon">🟡</span>
                    <span class="draft__type-title">마감 임박 안내<template lwc:if={isDueSoonRecommended}> <span class="draft__star">⭐ 추천</span></template></span>
                    <span class="draft__type-desc">3일 이내에 마감되는 자료만</span>
                </button>
                <button class={revisionClass} onclick={handleRevision} disabled={isLoading}>
                    <span class="draft__type-icon">🟠</span>
                    <span class="draft__type-title">보완 요청<template lwc:if={isRevisionRecommended}> <span class="draft__star">⭐ 추천</span></template></span>
                    <span class="draft__type-desc">받은 자료 중 빠진 부분만 정중히 요청</span>
                </button>
                <button class={infoClass} onclick={handleInfo} disabled={isLoading}>
                    <span class="draft__type-icon">🔵</span>
                    <span class="draft__type-title">정보 확인<template lwc:if={isInfoRecommended}> <span class="draft__star">⭐ 추천</span></template></span>
                    <span class="draft__type-desc">담당자·목표일·평가 범위 등 빈 정보 문의</span>
                </button>
            </div>

            <template lwc:if={isLoading}>
                <div class="draft__loading">
                    <lightning-spinner alternative-text="AI가 메일을 쓰는 중" size="small"></lightning-spinner>
                    <p>AI가 메일을 쓰고 있어요…</p>
                </div>
            </template>

            <template lwc:if={errorMessage}>
                <div class="draft__error" role="alert">{errorMessage}</div>
            </template>

            <template lwc:if={hasDraft}>
                <lightning-textarea
                    class="draft__text"
                    label="생성된 초안 (필요하면 직접 고칠 수 있어요)"
                    value={draft}
                    onchange={handleDraftChange}
                ></lightning-textarea>
                <p class="draft__hint">저장하면 프로젝트의 "AI 메일 초안" 칸에 들어가고, 메일 검토 상태는 "미검토"가 됩니다.</p>
                <template lwc:if={showSentCheck}>
                    <div class="draft__complete">
                        <lightning-input
                            type="checkbox"
                            label={completeLabel}
                            checked={completeTasks}
                            onchange={handleCompleteChange}
                        ></lightning-input>
                        <p class="draft__complete-hint">메일을 실제로 보냈을 때만 체크해 주세요. 체크하지 않으면 할 일은 그대로 남아요.</p>
                    </div>
                </template>
            </template>
        </div>

        <div slot="footer">
            <lightning-button label="닫기" onclick={handleClose}></lightning-button>
            <template lwc:if={hasDraft}>
                <lightning-button
                    class="slds-m-left_x-small"
                    label="다시 쓰기"
                    icon-name="utility:refresh"
                    onclick={handleRegenerate}
                    disabled={isLoading}
                ></lightning-button>
                <lightning-button
                    class="slds-m-left_x-small"
                    variant="brand"
                    label="초안 칸에 저장"
                    icon-name="utility:save"
                    onclick={handleSave}
                    disabled={isLoading}
                ></lightning-button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
